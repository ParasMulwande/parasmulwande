
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ParasMulwande
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=A3FFBF&color_dots=0D1117,161B22,21402D,347D4A,A3FFBF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=A3FFBF

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
